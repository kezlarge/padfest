<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      overflow: hidden;
    }
    #scan-btn {
      padding: 18px 36px;
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    #scan-btn:active {
      transform: scale(0.96);
    }
    #scanner-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      z-index: 10;
    }
    #qr-reader {
      width: 100vw !important;
      height: 100vh !important;
      border: none !important;
    }
    #qr-reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }
    #qr-reader__dashboard,
    #qr-reader__header_message,
    #qr-reader__status_span {
      display: none !important;
    }
    #accepted-text {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 42px;
      font-weight: 900;
      color: #22c55e;
      letter-spacing: 3px;
      z-index: 20;
      text-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
    }
  </style>
</head>
<body>

  <button id="scan-btn">Scan QR code</button>

  <div id="scanner-modal">
    <div id="qr-reader"></div>
  </div>

  <div id="accepted-text">ACCEPTED</div>

  <script>
    const scanBtn = document.getElementById('scan-btn');
    const scannerModal = document.getElementById('scanner-modal');
    const acceptedText = document.getElementById('accepted-text');
    let html5QrCode;

    function playBeep() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    function handleSuccess() {
      playBeep();
      
      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.6 },
        zIndex: 30
      });

      acceptedText.style.display = 'block';

      setTimeout(() => {
        acceptedText.style.display = 'none';
      }, 2000);
    }

    async function startScanner() {
      scannerModal.style.display = 'block';
      html5QrCode = new Html5Qrcode("qr-reader");

      const calculateSquareBox = (viewfinderWidth, viewfinderHeight) => {
        const edge = Math.min(viewfinderWidth, viewfinderHeight);
        const size = Math.floor(edge * 0.65);
        return { width: size, height: size };
      };

      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: calculateSquareBox },
          () => {
            html5QrCode.stop().then(() => {
              scannerModal.style.display = 'none';
              handleSuccess();
            });
          }
        );
      } catch (err) {
        alert('Unable to access camera: ' + err);
        scannerModal.style.display = 'none';
      }
    }

    scanBtn.addEventListener('click', startScanner);
  </script>
</body>
</html>
